<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/assets/highlight.css">
  <script>
    // Set theme before paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("deckbox-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" title="{{ app_name }} — home">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M3 11h18"/>
        </svg>
        <span class="brand-name">{{ app_name }}</span>
      </a>

      <nav class="crumbs" aria-label="Breadcrumb">
        {% for c in crumbs %}
          {% if not loop.last %}
            <a class="crumb" href="{{ '/' if c.rel == '' else '/view/' ~ c.rel }}">{{ c.name }}</a>
            <span class="crumb-sep" aria-hidden="true">/</span>
          {% else %}
            <span class="crumb crumb-current" aria-current="page">{{ c.name }}</span>
          {% endif %}
        {% endfor %}
      </nav>

      <div class="topbar-actions">
        {% block topbar_extra %}{% endblock %}
        <form class="goto-form" action="/goto" method="get" role="search"
              title="Jump to a directory path{% if allow_outside_root %} — anywhere on the machine{% else %} within the served folder{% endif %}">
          <svg class="goto-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M11 13h5M14 10l3 3-3 3"/></svg>
          <input class="goto-input" type="text" name="path" autocomplete="off" spellcheck="false"
                 placeholder="{% if allow_outside_root %}Go to path (anywhere)…{% else %}Go to path…{% endif %}"
                 aria-label="Go to directory path">
        </form>
        <a class="icon-btn home-btn" href="/" title="Home — {{ home_hint }}" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-5.5h5V20"/></svg>
        </a>
        <button class="icon-btn theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ app_name }} {{ version }}</span>
    <span class="footer-dot">·</span>
    <span>serving <code>{{ root_name }}</code></span>
  </footer>

  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
